[tool:pytest]
# pytest 配置文件

# 测试目录
testpaths = tests

# 测试文件模式
python_files = test_*.py *_test.py

# 测试类模式
python_classes = Test*

# 测试函数模式
python_functions = test_*

# 命令行选项
addopts =
    # 详细输出
    -v
    # 显示测试覆盖的本地变量
    -l
    # 显示每个测试的估计时间
    --durations=10
    # 并行执行测试（如果安装了 pytest-xdist）
    -n auto
    # 显示打印输出
    -s
    # 覆盖率配置
    --cov=core
    --cov-report=html:htmlcov
    --cov-report=term-missing
    --cov-report=xml:coverage.xml
    # 最小覆盖率要求
    --cov-fail-under=70
    # 异步测试支持
    --asyncio-mode=auto

# 标记定义
markers =
    unit: 单元测试
    integration: 集成测试
    slow: 慢速测试
    security: 安全测试
    performance: 性能测试
    ai: AI相关测试
    gui: GUI相关测试

# 覆盖率配置
[coverage:run]
source = core
omit =
    */tests/*
    */test_*.py
    */__pycache__/*
    */site-packages/*
    */venv/*
    */virtualenv/*
    */conftest.py

[coverage:report]
precision = 2
show_missing = True
skip_covered = False

exclude_lines =
    # 标准的跳过覆盖的代码
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
