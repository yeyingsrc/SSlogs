name: "自动化工具和爬虫检测"
pattern:
  # 仅匹配明确的自动化工具/攻击工具 User-Agent 关键字。
  # 注意：不要把 chrome/firefox/api/search 等普通词列入，否则正常浏览器流量全部误报。
  user_agent: "(?i)(sqlmap|nikto|nmap|masscan|dirbuster|gobuster|wfuzz|burp|owasp|hydra|john|hashcat|w3af|skipfish|wapiti|whatweb|joomscan|cmsmap|droopescan|pentest|metasploit|msfconsole|meterpreter|curl/|wget/|libwww|python-requests|go-http-client|java/|scrapy|selenium|phantomjs|headlesschrome|httpx|zgrab|netsparker|acunetix|appscan|paros|ratproxy|httrack|wget)"
severity: "medium"
category: "reconnaissance"
description: |
  检测自动化扫描工具、攻击框架和爬虫的 User-Agent 特征。
  仅匹配明确的工具标识，避免把普通浏览器(chrome/firefox/safari)误判为攻击工具。
cwe: "CWE-200"
attack_patterns:
  - "自动化扫描"
  - "攻击工具指纹"
  - "爬虫探测"
response_codes: [200, 404, 403, 401, 302, 500]
threat_level: "medium"
impact: "信息收集、漏洞扫描、服务器负载"
