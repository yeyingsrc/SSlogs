name: 攻击链关联检测规则
pattern:
  request_headers: '(?:(X-Attack-Stage|X-Kill-Chain):\s*(initial.*access|reconnaissance|weaponization))|(?:(X-Mitre-Tactic|X-ATT&CK):\s*(TA0001|Initial.*Access))|(?:(X-Privilege|X-Escalation):\s*(attempt|success|failure))|(?:(X-Mitre-Technique):\s*(T1068|T1548|T1055))|(?:(X-Discovery|X-Reconnaissance):\s*(network|system|user|domain))|(?:(X-C2|X-Command|X-Control):\s*(traffic|communication|beacon))|(?:(X-Mitre-Technique):\s*(T1071|T1105|T1571))|(?:(X-Exfiltration|X-Data.*Transfer):\s*(large|bulk|suspicious|unauthorized))|(?:(X-Attack-Timeline|X-Attack-Window):\s*([0-9]+|[A-Za-z0-9]+))'
  request_path: '(?:/(phishing|social|credential|brute.*force).*(attack|attempt|campaign))|(?:/(exploit|vulnerability|zero.*day).*(access|entry|infection))|(?:/(persistence|backdoor|implant|malware).*(install|create|establish))|(?:/(registry|startup|service|scheduled).*(task|job).*(create|modify))|(?:/(credential|password|hash|token).*(dump|steal|extract|harvest))|(?:/(sam|lsa|ntds|memory).*(dump|extract|access))|(?:/(scan|enum|discover|probe).*(network|system|port|service))|(?:/(whoami|netstat|ipconfig|systeminfo).*(command|query))|(?:/(smb|winrm|wmi|rdp|ssh).*(access|connect|login|exploit))|(?:/(remote|lateral|network).*(access|connection|movement))|(?:/(data|files|documents).*(collect|gather|copy|move|stage))|(?:/(archive|compress|encrypt).*(collection|staging|preparation))|(?:/(exfiltrate|exfil|leak|steal|export).*(data|files|information))|(?:/(ftp|sftp|http|https|dns).*(exfiltration|transfer|upload))'
  params: '(?:(execute|run|launch|spawn).*(payload|code|command|script))|(?:(eval|system|exec|shell).*(malicious|backdoor|evil))|(?:(persistence|backdoor|implant).*(install|create|establish|maintain))|(?:(registry|startup|service).*(create|modify|persist))|(?:(privilege|escalate|elevate|bypass).*(UAC|sudo|admin|root))|(?:(exploit|vulnerability).*(privilege|escalation|elevation))|(?:(disable|bypass|turn.*off).*(security|protection|defense))|(?:(hide|stealth|evade).*(detection|analysis|monitoring))|(?:(credential|password|hash|token).*(dump|steal|extract|harvest))|(?:(mimikatz|gsecdump|procdump|lsadump).*(tool|technique))|(?:(lateral|horizontal|movement|pivot).*(access|move|jump|propagate))|(?:(pass.*the.*hash|pth|credential).*(theft|reuse|dump|spray))|(?:(c2|command.*control|beacon|callback).*(traffic|communication|heartbeat))|(?:(dns|http|https|icmp).*(tunnel|covert|channel))'
  request_body: '(?:{"(action|command|execute)":\s*"(eval|system|exec|shell|cmd)"})|(?:{"(payload|code|script)":\s*"(malicious|backdoor|trojan|evil)"})|(?:{"(disable|bypass|turn.*off).*(security|protection|antivirus|firewall)"})|(?:{"(hide|stealth|evade).*(detection|analysis|monitoring)"})|(?:{"(collect|gather|exfiltrate|steal).*(data|information|files|documents)"})|(?:{"(stage|staging|collection).*(point|area|location)":\s*"(created|established)"})|(?:{"(attack.*chain|kill.*chain|cyber.*kill.*chain)":\s*"(stage|phase|step)"})|(?:{"(mitre|attack|tactic|technique).*(correlation|mapping|link)":\s*"(identified|detected)"})'
  user_agent: '(?:(cobalt.*strike|metasploit|empire|poshc2|powershell|cmd\.exe))|(?:(apt|lazarus|fancy.*bear|cozy.*bear).*(tool|malware|backdoor))'
  src_ip: '(\d+\.\d+\.\d+\.\d+).*?(c2|malicious|attacker|apt)'

severity: high
category: attack_chain_correlation
description: |
  攻击链关联检测规则，基于MITRE ATT&CK框架的多阶段攻击关联分析：

  **攻击链阶段识别**：
  - 初始访问(Initial Access)
  - 执行(Execution)
  - 持久化(Persistence)
  - 权限提升(Privilege Escalation)
  - 防御绕过(Defense Evasion)
  - 凭据访问(Credential Access)
  - 发现(Discovery)
  - 横向移动(Lateral Movement)
  - 收集(Collection)
  - 命令控制(Command and Control)
  - 数据渗出(Exfiltration)

  **MITRE ATT&CK映射**：
  - 战术(Tactic)识别
  - 技术(Technique)映射
  - 子技术(Sub-technique)关联
  - 攻击模式模式识别

  **攻击链关联分析**：
  - 多阶段攻击关联
  - 攻击时间窗口分析
  - 攻击者行为模式识别
  - 攻击基础设施关联

  **威胁狩猎支持**：
  - 已知攻击模式检测
  - 异常行为序列识别
  - 攻击指标关联
  - 威胁情报整合

  **事件关联**：
  - 跨事件关联分析
  - 时间序列关联
  - 实体关系映射
  - 攻击路径重建

cwe: "CWE-20"
references:
  - "https://attack.mitre.org/"
  - "https://www.lockheedmartin.com/en-us/capabilities/cyber/cyber-kill-chain.html"
  - "https://www.sans.org/white-papers/36659/"
attack_patterns:
  - "多阶段攻击"
  - "APT攻击"
  - "高级持续性威胁"
  - "零日攻击链"
response_codes: [200, 201, 301, 302, 400, 401, 403, 404, 500, 502, 503]
threat_level: "high"
impact: "可能表示复杂的APT攻击或高级持续性威胁，需要立即响应"

# 攻击链配置配置
attack_chain_config:
  enable_stage_correlation: true
  mitre_attack_mapping: true
  timeline_analysis: true
  attack_path_reconstruction: true

# MITRE ATT&CK配置
mitre_config:
  tactic_mapping: true
  technique_mapping: true
  sub_technique_analysis: true
  procedure_example_matching: true

# 关联分析配置
correlation_config:
  event_correlation: true
  time_window_analysis: true
  entity_relationship_mapping: true
  attack_pattern_matching: true

# 威胁狩猎配置
threat_hunting_config:
  known_attack_patterns: true
  anomaly_detection: true
  threat_intelligence_integration: true
  automated_hypothesis_generation: true