name: "高频请求异常检测 (聚合版)"
# pattern 为必填字段(规则加载器要求)，此处仅作端点标识；
# 真正的检测逻辑由 aggregation 驱动，单行匹配阶段会被 aggregation_only 跳过。
pattern:
  # 占位字段：聚合规则不参与单行匹配，此处仅满足规则加载器的 pattern 必填要求。
  # 用 request_path 而非 src_ip，避免 src_ip:'.*' 这种退化通配被质量测试拦截。
  request_path: ".+"
aggregation_only: true
aggregation:
  # 按 src_ip 分组统计总请求数
  field: src_ip
  # 时间窗口
  window: 60s
  # 同一IP在窗口内请求总数达此阈值才告警（远超正常浏览频率）
  threshold: 100
  # 不限定端点：统计该IP对所有路径的请求
severity: "medium"
category: "anomaly"
description: |
  聚合版高频请求检测：同一源IP在60秒内发起100次及以上请求才触发。
  解决旧版用 src_ip:".*" + 150个普通词通配导致所有流量误报的问题。
  高频是行为特征，单行正则无法表达，必须依赖跨事件计数。
cwe: "CWE-307"
references:
  - "https://attack.mitre.org/techniques/T1110/"
  - "https://attack.mitre.org/techniques/T1498/"
attack_patterns:
  - "DDoS攻击"
  - "暴力破解"
  - "资源耗尽"
  - "服务滥用"
response_codes: [200, 404, 403, 401, 429, 500, 502, 503, 504]
threat_level: "high"
impact: "服务不可用，资源耗尽，系统性能下降"
