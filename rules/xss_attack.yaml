name: "XSS攻击检测 (优化版)"
pattern:
  # 高危脚本注入 - 高置信度
  params_high: "(?i)(<\\s*script[^>]*>[\\s\\S]*?<\\s*/\\s*script\\s*>|<\\s*script[^>]*/\\s*>|javascript\\s*:[\\s\\S]*\\S|vbscript\\s*:[\\s\\S]*\\S|data\\s*:\\s*text/html[\\s\\S]*<[^>]+>)"

  # 危险事件处理器 - 高置信度
  params_events: "(?i)(\\bon\\w+\\s*=\\s*[\\\"\\'\\`]?[\\s\\S]*?(?:alert|confirm|prompt|eval|Function|setTimeout|setInterval|fetch|XMLHttpRequest|document\\.|window\\.)[\\s\\S]*?[\\\"\\'\\`]?[\\s/>])"

  # DOM XSS危险函数 - 中等置信度
  params_dom: "(?i)(document\\.(write|writeln)\\s*\\(|\\.innerHTML\\s*=\\s*[^\\n]+|\\.outerHTML\\s*=\\s*[^\\n]+|insertAdjacentHTML\\s*\\(|\\.insertAdjacentHTML|document\\.(cookie|location|URL|referrer|domain)\\s*[=[]"

  # JavaScript危险函数 - 中等置信度
  params_js_funcs: "(?i)(\\beval\\s*\\(|new\\s+Function\\s*\\(|setTimeout\\s*\\(\\s*[\\\"\\'\\`]|setInterval\\s*\\(\\s*[\\\"\\'\\`]|constructor\\s*\\(\\s*\\)|window\\[|document\\[|\\[[\\s\\S]*\\]\\(\\s*[\\\"\\'\\`])"

  # HTML5危险标签 - 低置信度
  params_html5: "(?i)(<\\s*(svg|object|embed|math|iframe|frame|frameset|applet|form|input|button|textarea|select|meta|link|base|details|marquee)[^>]*(?:on\\w+|src|href|data|formaction|action|poster|background)\\s*=)"

  # CSS注入 - 低置信度
  params_css: "(?i)(style\\s*=\\s*[\\\"\\'\\`]?[\\s\\S]*?(?:expression\\s*\\(|behavior\\s*:|binding\\s*:|-moz-binding\\s*:|@import|url\\s*\\(\\s*[\\\"\\'\\`]?javascript)[\\s\\S]*?[\\\"\\'\\`])"

  # 编码绕过 - 需要解码检测
  decoded_params: "(?i)(&#x[0-9a-f]+;?|&#\\d+;?|\\\\u[0-9a-f]{4}|\\\\x[0-9a-f]{2}|%3c|%3e|%26lt|%26gt|&lt;|&gt;)[\\s\\S]*?(script|iframe|object|embed|on\\w+|javascript|vbscript|data\\s*:)"

  # URL编码的XSS
  params_encoded: "(%3C\\s*%73\\s*%63\\s*%72\\s*%69\\s*%70\\s*%74|%3C\\s*script|%253Cscript|&#x3C;script|&#60;script)"

  # 模板注入
  params_template: "(\\{\\{\\s*[\\s\\S]*?\\}\\}|\\$\\{[\\s\\S]*?\\}|\\{\\%\\s*[\\s\\S]*?\\s*\\%\\}|<%\\s*[\\s\\S]*?\\s*%>)"

  # JSONP劫持风险
  params_jsonp: "(callback\\s*=\\s*\\w+[\\w\\.]*\\s*(?:[\\&\\?]|$)|jsoncallback\\s*=|jsonp\\s*=\\s*\\w+)"

  # 扫描工具特征
  user_agent: "(?i)(xsser|xss-validator|xss-payloader|xss-ray|owasp xenotix|cros78)"

severity: high
category: xss
confidence_levels:
  high:
    - params_high
    - params_events
    - user_agent
  medium:
    - params_dom
    - params_js_funcs
    - params_template
  low:
    - params_html5
    - params_css
    - params_jsonp
description: |
  优化版XSS检测，采用置信度分级和上下文验证
cwe: "CWE-79"
owasp: "A03:2021 - Injection"
attack_patterns:
  - "反射型XSS"
  - "存储型XSS"
  - "DOM型XSS"
  - "突变型XSS"
  - "CSS注入"
  - "模板注入"
  - "JSONP劫持"
response_codes: [200, 302, 404, 400]
threat_level: "high"
impact: "可能导致会话劫持、钓鱼攻击、数据窃取或恶意脚本执行"
