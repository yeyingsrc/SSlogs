name: "异常状态码检测"
pattern:
  # 仅5xx服务器错误视为可疑（4xx多为正常客户端行为如404/403，不应单独告警）
  status_code: "(5[0-9]{2})"
  # 仅匹配明确的敏感管理/调试路径，不用 .*(api|login) 等普通词通配
  request_path: "(?i)/(phpmyadmin|adminer|wp-admin|manager/html|jmx-console|web-console|jenkins|actuator|console|debug|swagger-ui|graphql)(/|$)"
severity: "medium"
category: "error_analysis"
description: "检测敏感路径上的异常HTTP状态码，可能表示攻击尝试"
cwe: "CWE-200"
references:
  - "https://attack.mitre.org/techniques/T1083/"
  - "https://attack.mitre.org/techniques/T1190/"
attack_patterns:
  - "错误信息泄露"
  - "路径枚举"
  - "未授权访问"
  - "服务异常"
response_codes: [400, 401, 403, 404, 405, 406, 407, 408, 409, 410, 411, 412, 413, 414, 415, 416, 417, 418, 421, 422, 423, 424, 425, 426, 428, 429, 431, 451, 500, 501, 502, 503, 504, 505, 506, 507, 508, 510, 511]
threat_level: "medium"
impact: "信息泄露，系统指纹识别"