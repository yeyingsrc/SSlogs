name: 金融行业安全威胁检测
pattern:
  request_path: '(?:/(api|service)/.*?(payment|pay|checkout|transaction|settlement))|(?:/(payment|gateway|processor|merchant)/.*?(authorize|capture|refund|void))|(?:/(api|service)/.*?(transfer|wire|remittance|exchange).*(suspicious|unusual))|(?:/(compliance|aml|kyc|audit).*(bypass|override|skip|ignore))|(?:/(api|trade|market|stock|forex|crypto)/.*?(execute|place|cancel|modify))|(?:/(portfolio|account|wallet).*(balance|position|holding).*(manipulate|alter))|(?:/(login|signin|account|bank|secure).*(verify|confirm|update|security))|(?:/(suspicious|phishing|fake|scam).*(page|site|login))|(?:/(api|wallet|exchange|blockchain)/.*?(bitcoin|ethereum|crypto|token))|(?:/(wallet|address|private.*key).*(drain|steal|hack|exploit))|(?:/(insurance|claim|policy|coverage)/.*?(fraud|false|fake|exaggerated))|(?:/(medical|health|auto|home|life).*(insurance|claim).*(suspicious|fraudulent))|(?:/(loan|credit|mortgage|lending)/.*?(fraud|false|misrepresentation))|(?:/(application|approval|underwriting).*(bypass|override|manipulate))|(?:/(api|webhook|service).*(banking|payment|financial|transaction))|(?:/(open.*banking|plaid|stripe|paypal).*(abuse|exploit|attack))'
  params: '(?:(amount|total|price|cost).*(negative|zero|0\.0|0\.01|-|%20|%2D))|(?:(payment|transaction).*(bypass|override|skip|hack|crack|exploit))|(?:(card|credit|debit).*(number|cvv|cvc|exp|expiry).*(test|fake|sample))|(?:(aml|anti.*money.*laundering).*(violation|bypass|ignore|disable))|(?:(kyc|know.*your.*customer).*(bypass|skip|override|fake|forged))|(?:(transaction|transfer).*(structuring|smurfing|layering|integration))|(?:(trade|order|transaction).*(spoofing|layering|front.*running|wash.*trading))|(?:(price|rate|quote).*(manipulate|artificial|inflate|deflate))|(?:(insider|material|non.*public).*(information|data|tip).*(use|leak|trade))|(?:(atm|pos|terminal).*(skimming|shimming|malware|backdoor))|(?:(pin|password|secret).*(capture|harvest|steal|log))|(?:(magstripe|chip|nfc).*(cloning|copying|intercept))|(?:(bitcoin|btc|ethereum|eth|usdt).*(double.*spend|51.*%|attack|exploit))|(?:(private.*key|seed|phrase|mnemonic).*(expose|leak|steal|share))|(?:(smart.*contract|defi|yield.*farm).*(exploit|drain|hack|vulnerability))|(?:(claim|policy|coverage).*(fraud|false|fake|forged|exaggerated))|(?:(medical|health).*(bill|invoice|treatment).*(inflated|unnecessary|fake))|(?:(pci|dss|sox|finra|sec).*(compliance|violation|bypass|ignore))|(?:(regulation|compliance|audit).*(fail|skip|override|disable))|(?:(hft|high.*frequency|algorithmic|program).*(trading|abuse|manipulation))|(?:(latency|arbitrage|co.*location).*(exploit|advantage|abuse))|(?:(loan|credit|mortgage).*(application|approval).*(fraud|false|forged))|(?:(income|employment|asset).*(misrepresentation|falsification|exaggeration))'
  request_body: '(?:{"(card_number|credit_card|account_number)":\s*"[0-9]{15,19}")|(?:{"(cvv|cvc|security_code|pin)":\s*"[0-9]{3,4}")|(?:{"(routing_number|swift_code|iban)":\s*"[A-Z0-9]{8,34}")|(?:{"(ssn|tax_id|social_security)":\s*"[0-9]{9}")|(?:{"(customer|client|account).*(data|information|details)":\s*"(exposed|leaked|public)"})|(?:{"(financial|money|payment).*(records|data|history)":\s*"(accessible|public|unprotected)"})'
  request_headers: '(?:(X-Phishing|X-Fraud|X-Scam):\s*(detected|suspicious|malicious))|(?:(Referer|Origin):\s*(phishing|fake|spoof|malicious).*\.(com|net|org))|(?:(X-Compliance|X-Audit|X-Regulatory):\s*(fail|violation|bypass|override))'
  user_agent: '(?:(mobile|banking|finance|payment).*(app|client|sdk).*(rooted|jailbroken|compromised))|(?:(android|ios).*(banking|finance).*(malware|trojan|backdoor))'

severity: critical
category: financial_security
description: |
  金融行业安全威胁检测规则，专门针对金融服务和支付系统：

  **支付系统安全**：
  - 支付端点攻击检测
  - 交易欺诈模式识别
  - 支付绕过尝试监控
  - 货币价值篡改检测

  **信用卡和银行账户保护**：
  - 敏感卡信息泄露检测
  - 银行账户访问异常
  - 交易授权绕过识别
  - 金融数据暴露监控

  **反洗钱(AML)合规**：
  - 洗钱模式检测
  - 可疑交易识别
  - 资金结构化监控
  - KYC流程绕过检测

  **证券和交易安全**：
  - 市场操纵行为检测
  - 内幕交易识别
  - 高频交易滥用监控
  - 投资组合异常访问

  **加密货币安全**：
  - 数字货币攻击检测
  - 智能合约漏洞利用
  - 钱包安全威胁识别
  - 区块链攻击模式分析

  **保险欺诈检测**：
  - 保险索赔欺诈识别
  - 虚假保单检测
  - 医疗费用欺诈监控
  - 财产保险滥用检测

  **合规性监控**：
  - PCI DSS合规检查
  - SOX法案合规验证
  - 金融监管违规识别
  - 审计流程异常检测

  **移动银行安全**：
  - 移动应用攻击检测
  - 设备完整性验证
  - 移动交易异常监控
  - 生物识别安全检查

cwe: "CWE-209"
references:
  - "https://www.pcisecuritystandards.org/"
  - "https://www.fincen.gov/resources/statutes-regulations/bank-secrecy-act"
  - "https://www.sec.gov/"
  - "https://www.ffiec.gov/"
attack_patterns:
  - "支付系统攻击"
  - "金融数据泄露"
  - "洗钱活动"
  - "市场操纵"
response_codes: [200, 201, 301, 302, 400, 401, 403, 404, 500, 502, 503]
threat_level: "critical"
impact: "可能导致直接财务损失、监管处罚、声誉损害和客户信任危机"

# 金融安全配置
financial_config:
  payment_security: true
  fraud_detection: true
  compliance_monitoring: true
  data_protection: true

# 支付安全配置
payment_config:
  pci_dss_compliance: true
  transaction_monitoring: true
  fraud_detection_rules: true
  chargeback_protection: true

# 反洗钱配置
aml_config:
  transaction_monitoring: true
  suspicious_activity_reporting: true
  customer_due_diligence: true
  san_list_screening: true

# 合规性配置
compliance_config:
  regulatory_monitoring: true
  audit_logging: true
  reporting_automation: true
  policy_enforcement: true

# 风险管理配置
risk_management:
  real_time_risk_assessment: true
  anomaly_detection: true
  behavioral_analysis: true
  adaptive_scoring: true