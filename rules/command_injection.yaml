name: "命令注入攻击检测 (优化版)"
pattern:
  # 高危命令组合 - 高置信度
  params_critical: "(?i)([;&|`]\\s*|(?<=\\=))[\\\"\\']?\\s*(whoami\\s*;|id\\s*;|uname\\s+-a|cat\\s+/etc/(passwd|shadow|hosts)|netstat\\s+-|ifconfig\\s*-a|ps\\s+(aux|ef)|ls\\s+-la\\s*/\\s*;|rm\\s+-rf\\s*/)\\s*[\\\"\\']?"

  # 命令分隔符+敏感命令 - 高置信度
  params_separators: "(?i)(\\;|\\|\\||\\|\\&\\&|\\`|\\$\\()\\s*[\\\"\\']?\\s*(whoami|id\\s*-a|uname|hostname|pwd|cat\\s+|type\\s+|head\\s+|tail\\s+|grep\\s+|find\\s+|chmod\\s+|chown\\s+|rm\\s+|mv\\s+|cp\\s+|wget\\s+|curl\\s+|nc\\s+|netcat\\s+|bash\\s+-|sh\\s+-|python\\s+-|perl\\s+-|php\\s+-|ruby\\s+-)\\s"

  # 反引号命令替换 - 高置信度
  params_backtick: "\\`\\s*[^\\`]+\\s*\\`|\\$\\(\\s*[^\\)]+\\s*\\)"

  # 管道和重定向攻击 - 高置信度
  params_pipe: "(?i)(\\|\\s*(bash|sh|python|perl|ruby|php|nc|netcat|telnet|ftp|wget|curl)|>\\s*/(tmp|var|etc|dev|proc)|>>\\s*/(tmp|var|etc)|<\\s*/(etc|proc|var))"

  # 网络相关命令 - 中等置信度
  params_network: "(?i)([;&|]\\s*|\\$\\()\\s*(nc\\s+-|netcat\\s+-|telnet\\s+|wget\\s+http|curl\\s+http|curl\\s+-|wget\\s+-|nmap\\s+|masscan\\s+|hydra\\s+|john\\s+|hashcat\\s+)"

  # Windows命令 - 中等置信度
  params_windows: "(?i)(cmd\\.exe\\s*/c|powershell\\s+-|wscript\\.|cscript\\.|tasklist|taskkill\\s+|net\\s+(user|localgroup|share)|netsh\\s+|reg\\s+(query|add|delete)|wmic\\s+|systeminfo)"

  # 反序列化攻击 - 高置信度
  params_deserialize: "(?i)(pickle\\.loads|yaml\\.load\\(|marshal\\.loads|unserialize\\(|ObjectInputStream|readObject\\(|__reduce__|subprocess\\.(call|run|Popen)|os\\.system\\(|os\\.popen\\()"

  # 编码绕过 - 需要解码检测
  decoded_params: "(?i)((base64|hex|rot13|url|unicode).*(decode|unencode)|echo\\s+[A-Za-z0-9+/=]+\\s*\\|\\s*(base64|bash|sh|python|perl)|python\\s+-c\\s*import|eval\\s*\\(|exec\\s*\\()"

  # 请求头中的命令注入
  request_headers: "(?i)(User-Agent|Referer|X-Forwarded-For|Cookie):\\s*[^\\n]*?(\\;|\\||\\`|\\$\\().*(?:wget|curl|nc|bash|python|perl|cmd\\.exe|powershell)"

  # User-Agent中的攻击工具
  user_agent: "(?i)(wget/|curl/|libwww|python-requests|nikto|nmap|masscan|metasploit|dirbuster|gobuster|wfuzz|burp)"

  # 后门和反弹Shell - 高置信度
  params_backdoor: "(?i)(nc\\s+.-e\\s+(bash|sh|cmd)|bash\\s+-i\\s+>|perl\\s+-e\\s+|python\\s+-c\\s+.*socket|rm\\s+/tmp/|/dev/tcp/|/dev/udp/|mkfifo\\s+/tmp/)"

  # 文件写入攻击
  params_write: "(?i)(echo\\s+.*>\\s*/(etc|var|tmp|home|root)|printf\\s+.*>\\s*/(etc|var|tmp)|(curl|wget).*\\|\\s*(bash|sh|tar|unzip))"

severity: critical
category: command_injection
confidence_levels:
  high:
    - params_critical
    - params_separators
    - params_backtick
    - params_backdoor
    - params_deserialize
  medium:
    - params_pipe
    - params_network
    - params_windows
    - params_write
    - request_headers
  low:
    - decoded_params
    - user_agent
description: |
  优化版命令注入检测，大幅降低误报率：
  - 所有命令检测都需要命令分隔符上下文
  - 不再单独检测常见命令（ls/cat/whoami等）
  - 专注于命令组合和攻击模式
cwe: "CWE-78"
owasp: "A03:2021 - Injection"
attack_patterns:
  - "命令注入"
  - "参数注入"
  - "反弹Shell"
  - "后门植入"
  - "反序列化攻击"
response_codes: [200, 403, 500, 502]
threat_level: "critical"
impact: "可能导致远程代码执行、系统完全控制或横向移动"
